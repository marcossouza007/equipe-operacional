version: '3.8'

services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    environment:
      - DEBUG=True
      - DATABASE_URL=sqlite:///./equipe.db
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_HOST=qdrant
    depends_on:
      - ollama
      - qdrant
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Ollama (IA Local)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  # Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=

  # PostgreSQL (opcional)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=equipe_operacional
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - postgres

volumes:
  ollama_data:
  qdrant_storage:
  postgres_data:
